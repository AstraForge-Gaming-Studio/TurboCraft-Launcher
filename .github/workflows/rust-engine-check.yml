name: Rust edition engine build check

# This is an isolated prototype artifact, not a TCL release or playable APK.
on:
  push:
    branches: ['arena/**']
    paths:
      - 'rust-edition/**'
      - '.github/workflows/rust-engine-check.yml'
  workflow_dispatch:
    inputs:
      abi:
        description: Android architecture to compile
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Starling source
        uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: 5432370d573642041585c69b40fb045b27133488
          path: .external/starling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'build-tools;35.0.0' 'platforms;android-36' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build and verify native library
        env:
          RUST_EDITION_ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: ./rust-edition/build-engine.sh .external/starling "$RUST_EDITION_ABI" "$RUNNER_TEMP/rust-engine"
      - name: Upload engine build proof
        uses: actions/upload-artifact@v4
        with:
          name: rust-engine-${{ inputs.abi || 'arm64-v8a' }}
          path: ${{ runner.temp }}/rust-engine/
          if-no-files-found: error
          retention-days: 7
