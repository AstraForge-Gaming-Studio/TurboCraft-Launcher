name: Rust edition engine build check

# Experimental build and packaging checks only. This workflow never publishes a release.
on:
  push:
    branches: ['arena/**']
    paths:
      - 'rust-edition/**'
      - 'RustEditionBridge/**'
      - 'settings.gradle.kts'
      - 'TCL/**'
      - '.github/workflows/rust-engine-check.yml'
  workflow_dispatch:
    inputs:
      abi:
        description: Android architecture to compile
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

permissions:
  contents: read

concurrency:
  group: rust-engine-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile the isolated Android bridge
        run: |
          set -o pipefail
          bash ./gradlew :RustEditionBridge:assembleDebug 2>&1 | tee bridge-build.log
      - name: Report bridge build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path('bridge-build.log')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              message = '\n'.join(lines[-80:]).replace('%', '%25').replace('\n', '%0A').replace('\r', '')[:20000]
              if message: print(f'::error title=bridge-build::{message}')
          PY
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Starling source
        uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: 5432370d573642041585c69b40fb045b27133488
          path: .external/starling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android build dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'build-tools;35.0.0' 'platforms;android-36' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build and verify native library
        env:
          RUST_EDITION_ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: ./rust-edition/build-engine.sh .external/starling "$RUST_EDITION_ABI" "$RUNNER_TEMP/rust-engine"
      - name: Build setup assets and stage the matching runtime
        env:
          RUST_EDITION_ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          python3 .external/starling/packaging/android/build_apk.py --abi "$RUST_EDITION_ABI" --profile quick --no-build
          apk=$(find .external/starling/target/android -maxdepth 1 -name "starling-*-$RUST_EDITION_ABI.apk" -print -quit)
          test -n "$apk"
          python3 rust-edition/stage_runtime.py "$apk" "$RUST_EDITION_ABI" "$RUNNER_TEMP/rust-engine" "$RUNNER_TEMP/rust-runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-runtime-${{ inputs.abi || 'arm64-v8a' }}
          path: ${{ runner.temp }}/rust-runtime/
          if-no-files-found: error
          retention-days: 1
      - name: Upload engine build proof
        uses: actions/upload-artifact@v4
        with:
          name: rust-engine-${{ inputs.abi || 'arm64-v8a' }}
          path: ${{ runner.temp }}/rust-engine/
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-runtime-${{ inputs.abi || 'arm64-v8a' }}
          path: rust-edition/runtime
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install native build tools
        run: |
          curl -fsSL "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz" | tar xz -C "$HOME/.cargo/bin" --strip-components=1
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'ndk;25.2.9519653' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble experimental TCL debug APK
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          case "$ABI" in
            arm64-v8a) arch=arm64 ;;
            armeabi-v7a) arch=arm ;;
            x86) arch=x86 ;;
            x86_64) arch=x86_64 ;;
            *) exit 1 ;;
          esac
          set -o pipefail
          bash ./gradlew :TCL:assembleDebug -Darch="$arch" -PrustEdition=true 2>&1 | tee integration-build.log
      - name: Report integration build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path('integration-build.log')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              message = '\n'.join(lines[-80:]).replace('%', '%25').replace('\n', '%0A').replace('\r', '')[:20000]
              if message: print(f'::error title=integration-build::{message}')
          PY
      - name: Verify Rust files in APK
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, zipfile
          abi = os.environ['ABI']
          manifests = json.load(open(f'rust-edition/runtime/runtime-{abi}.json'))['sha256']
          apks = glob.glob('TCL/build/outputs/apk/debug/*.apk')
          assert len(apks) == 1, apks
          with zipfile.ZipFile(apks[0]) as apk:
              for path, expected in manifests.items():
                  apk_path = path.replace('jniLibs/', 'lib/', 1)
                  try:
                      actual = hashlib.sha256(apk.read(apk_path)).hexdigest()
                  except KeyError:
                      print(f'::error title=rust-package::Missing {apk_path}', flush=True)
                      raise
                  if actual != expected:
                      print(f'::error title=rust-package::Hash mismatch for {apk_path}: {actual} expected {expected}', flush=True)
                      raise SystemExit(1)
          print('Verified packaged Rust runtime and setup assets:', apks[0])
          PY
