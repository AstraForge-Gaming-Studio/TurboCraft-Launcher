name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK build variant
        required: true
        type: choice
        default: Debug
        options: [Debug, Release]
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      DISCORD_APP_ID:
        required: false

jobs:
  rust-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: 5432370d573642041585c69b40fb045b27133488
          path: .external/starling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Starling build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'build-tools;35.0.0' 'platforms;android-36' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build and stage native Rust edition
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          ./rust-edition/build-engine.sh .external/starling "$ABI" "$RUNNER_TEMP/proof"
          python3 .external/starling/packaging/android/build_apk.py --abi "$ABI" --profile quick --no-build
          apk=$(find .external/starling/target/android -maxdepth 1 -name "starling-*-$ABI.apk" -print -quit)
          test -n "$apk"
          python3 rust-edition/stage_runtime.py "$apk" "$ABI" "$RUNNER_TEMP/proof" "$RUNNER_TEMP/runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-runtime-${{ matrix.abi }}
          path: ${{ runner.temp }}/runtime/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: rust-runtime
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # Discord Rich Presence application id (public, not a credential). Empty = feature off.
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download staged Rust runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: rust-runtime-*
          path: ${{ runner.temp }}/rust-runtimes

      - name: Select and validate runtime architectures
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            all) abis='arm64-v8a armeabi-v7a x86 x86_64' ;;
            arm64) abis='arm64-v8a' ;;
            arm) abis='armeabi-v7a' ;;
            x86) abis='x86' ;;
            x86_64) abis='x86_64' ;;
            *) exit 1 ;;
          esac
          echo "RUST_ABIS=$abis" >> "$GITHUB_ENV"
          python3 rust-edition/merge_runtime.py "$RUNNER_TEMP/rust-runtimes" rust-edition/runtime $abis

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ndk="$ANDROID_HOME/ndk/25.2.9519653"
          if [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;25.2.9519653"
          fi
          sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0"
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # CMake is only needed by :DiscordRPC (Discord Social SDK native bridge)
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            sdkmanager --install "cmake;3.22.1"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew TCL:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }} 2>&1 | tee gradle-build.log

      - name: Verify packaged Rust edition
        run: |
          set -euo pipefail
          variant=$(echo '${{ inputs.variant }}' | tr '[:upper:]' '[:lower:]')
          mapfile -t apks < <(find "TCL/build/outputs/apk/$variant" -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          python3 rust-edition/verify_apk.py "${apks[0]}" rust-edition/runtime $RUST_ABIS
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "${apks[0]}" AndroidManifest.xml > "$RUNNER_TEMP/apk-manifest.txt"
          grep -q 'io.github.juanluci.starling.GameActivity' "$RUNNER_TEMP/apk-manifest.txt"
          grep -q 'io.github.juanluci.starling.LauncherActivity' "$RUNNER_TEMP/apk-manifest.txt"

      # The raw job log is not always retrievable from the API, so surface the interesting
      # part of a failed build as check-run annotations.
      - name: Report Gradle failure
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then exit 0; fi
          # GitHub only renders 10 annotations per step, so pack many compiler errors into
          # each annotation instead of emitting one per line. That way the whole error list
          # stays readable through the check-run annotations API.
          python3 - <<'PYEOF'
          import re, sys

          pat = re.compile(r"^(e: |w: .*error)|FAILURE:|What went wrong|Caused by|> Task .* FAILED|error:|CMake Error|Execution failed")
          seen, lines = set(), []
          with open("gradle-build.log", errors="ignore") as fh:
              for raw in fh:
                  line = raw.strip()
                  if not line or not pat.search(line):
                      continue
                  line = re.sub(r"^\[\s*\d+%\]\s*", "", line)
                  line = line.replace("file:///home/runner/work/TurboCraft-Launcher/TurboCraft-Launcher/", "")
                  if line in seen:
                      continue
                  seen.add(line)
                  lines.append(line)

          summary = "\n".join(lines[:400])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Gradle errors\n\n```\n" + summary + "\n```\n")

          chunk, size = [], 8
          for i in range(0, len(lines[:200]), size):
              chunk.append("\n".join(lines[i:i + size]))
          for idx, text in enumerate(chunk[:10], 1):
              safe = text.replace("%", "%25").replace("\r", " ").replace("\n", "%0A")[:4000]
              if safe:
                  print(f"::error title=gradle-{idx}::{safe}")
          PYEOF

      - name: Verify PetLib native library
        if: inputs.variant == 'Release'
        run: |
          set -e
          APK=$(ls TCL/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          FOUND=$(unzip -l "$APK" | grep -c "libpetlib\.so" || true)
          echo "libpetlib.so entries: $FOUND"
          unzip -l "$APK" | grep "libpetlib\.so" || true
          if [ "$FOUND" -lt 1 ]; then
            echo "::error title=petlib-missing::libpetlib.so is not packaged in $APK"
            exit 1
          fi
          ABIS=$(unzip -l "$APK" | grep "libpetlib\.so" | awk '{print $4}' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ABIs: $ABIS"
          case "${{ matrix.arch }}" in
            all) EXPECT=4 ;;
            *) EXPECT=1 ;;
          esac
          COUNT=$(echo $ABIS | wc -w)
          if [ "$COUNT" -lt "$EXPECT" ]; then
            echo "::error title=petlib-abi::${{ matrix.arch }} APK has $COUNT ABI(s), expected $EXPECT"
            exit 1
          fi
          echo "OK: $COUNT ABI(s) with libpetlib.so"

      - name: Verify bundled MobileGlues version
        run: |
          set -e
          # Minecraft 26.3+ renders through the new pipeline whose shaders declare
          # uniform blocks with member initialisers. MobileGlues 2.0.0 cut those
          # blocks apart while stripping the initialisers, which broke the terrain
          # shaders and left a black screen; the token-aware rewrite landed in
          # 2.0.1 (version code 2010). Never ship anything older.
          MG_VERSION=$(unzip -p TCL/libs/MobileGlues-release.aar jni/arm64-v8a/libmobileglues.so \
            | strings | grep -m1 'MG_MOBILEGLUES_VERSION' | awk '{print $3}')
          echo "Bundled MobileGlues version code: ${MG_VERSION:-unknown}"
          if [ -z "${MG_VERSION:-}" ] || [ "$MG_VERSION" -lt 2010 ]; then
            echo "::error title=mobileglues-too-old::bundled MobileGlues is ${MG_VERSION:-unknown}, need 2010 (2.0.1) or newer"
            exit 1
          fi

      - name: Verify bundled renderers
        if: inputs.variant == 'Release'
        run: |
          set -e
          APK=$(ls TCL/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          for LIB in libmobileglues.so libSimpleFPEWrapper.so; do
            if ! unzip -l "$APK" | grep -q "$LIB"; then
              echo "::error title=renderer-missing::$LIB is not packaged in $APK"
              exit 1
            fi
            echo "OK: $LIB packaged"
          done

      - name: Verify Discord Rich Presence native library
        if: inputs.variant == 'Release'
        run: |
          set -e
          APK=$(ls TCL/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          for LIB in libtcdiscordrpc.so libdiscord_partner_sdk.so; do
            if ! unzip -l "$APK" | grep -q "$LIB"; then
              echo "::error title=discord-missing::$LIB is not packaged in $APK"
              exit 1
            fi
            echo "OK: $LIB packaged"
          done

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.arch }}
          path: TCL/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ matrix.arch }}
          path: TCL/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
