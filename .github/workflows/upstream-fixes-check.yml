name: Launcher compatibility tests

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android native build tools
        run: |
          curl -fsSL 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' | tar xz -C "$HOME/.cargo/bin" --strip-components=1
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'ndk;25.2.9519653' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify committed LWJGL components
        run: python3 scripts/check_lwjgl_components.py
      - name: Verify bundled Java runtime archive sets
        run: python3 scripts/check_bundled_runtimes.py
      - name: Test native Java Sound playback and capture behavior
        run: bash scripts/test_jsound_host.sh
      - name: Verify shader compiler SPIR-V symbols on every ABI
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p TCL/libs/lwjgl-3.4.1-natives-release.aar "assets/app_runtime/lwjgl/3.4.1/natives/$abi/libshaderc.so" > "$RUNNER_TEMP/shaderc.so"
            readelf --dyn-syms -W "$RUNNER_TEMP/shaderc.so" > "$RUNNER_TEMP/shaderc-symbols.txt"
            awk '$8 == "spvSoftwareVersionString" && $7 != "UND" { found=1 } END { exit !found }' "$RUNNER_TEMP/shaderc-symbols.txt"
          done
      - name: Build LWJGL artifacts with the matching GLFW bindings
        run: |
          set -o pipefail
          bash ./gradlew :LWJGL:lwjgl-3.3.3:jar :LWJGL:lwjgl-3.4.1:jar --console=plain 2>&1 | tee test-build.log
          for version in 3.3.3 3.4.1; do
            test -s "TCL/src/main/assets/app_runtime/lwjgl/$version/lwjgl-$version-merged-modules.jar"
            test -s "TCL/src/main/assets/app_runtime/lwjgl/$version/version"
          done
          python3 scripts/check_lwjgl_components.py
      - name: Upload matching LWJGL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-components
          path: |
            TCL/src/main/assets/app_runtime/lwjgl/3.3.3/lwjgl-3.3.3-merged-modules.jar
            TCL/src/main/assets/app_runtime/lwjgl/3.3.3/version
            TCL/src/main/assets/app_runtime/lwjgl/3.4.1/lwjgl-3.4.1-merged-modules.jar
            TCL/src/main/assets/app_runtime/lwjgl/3.4.1/version
          if-no-files-found: error
      - name: Test account, download and GLFW fixes
        run: |
          set -o pipefail
          bash ./gradlew :TCL:testDebugUnitTest \
            --tests 'com.movtery.zalithlauncher.game.account.PassportServerIdTest' \
            --tests 'com.movtery.zalithlauncher.game.account.microsoft.DeviceCodePollingTest' \
            --tests 'com.movtery.zalithlauncher.game.renderer.config.OrderedChoiceEntryTest' \
            --tests 'com.movtery.zalithlauncher.game.multirt.NativeSoundInstallerTest' \
            --tests 'com.movtery.zalithlauncher.game.addons.mirror.AssetsSourceOrderTest' \
            --tests 'com.movtery.zalithlauncher.game.download.engine.FetcherHttpTest' \
            --tests 'com.movtery.zalithlauncher.game.input.EventWaitNativeTest' \
            --tests 'com.movtery.zalithlauncher.game.input.PackagedGlfwEventWaitTest' \
            --tests 'com.movtery.zalithlauncher.coroutine.TaskFlowCancellationTest' \
            --tests 'com.movtery.zalithlauncher.utils.device.ArchitectureTest' \
            --tests 'com.movtery.zalithlauncher.game.renderer.MesaEnvironmentTest' \
            --tests 'com.movtery.zalithlauncher.setting.SettingReadFallbackTest' \
            --tests 'com.movtery.zalithlauncher.ui.screens.content.VersionExportFilterTest' \
            --tests 'com.movtery.zalithlauncher.game.path.GamePathSafetyTest' \
            --tests 'com.movtery.zalithlauncher.game.version.mod.update.ReplaceUpdatedModTest' \
            --tests 'com.movtery.zalithlauncher.game.version.multiplayer.StatusResponseFaviconTest' \
            --console=plain 2>&1 | tee test-build.log
      - name: Report failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('test-build.log')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              relevant = [line for line in lines if re.search(r'(?i)(^e: |error:|failed|failure:|what went wrong|^\* |exception)', line)]
              text = ('\n'.join(relevant[-35:] + ['--- final output ---'] + lines[-20:]))[-12000:]
              for i in range(0, len(text), 3000):
                  msg = text[i:i+3000].replace('%', '%25').replace('\n', '%0A').replace('\r', '')
                  print(f'::error title=compatibility-check-{i//3000+1}::{msg}')
          PY
